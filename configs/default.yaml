# Relative paths resolve against the directory crackqa is run from (the repo root).
seed: 42

paths:
  raw: data/raw/CRACK500
  processed: data/processed   # tile list, split manifest
  outputs: outputs            # model weights, batch results
  reports: reports            # committed reports and figures

data:
  # split name -> folder under paths.raw. The archive ships full photos only for val and
  # test, so every split uses the official 640x360 crops.
  splits:
    train: traincrop
    val: valcrop
    test: testcrop
  image_exts: [".jpg"]
  # a file ending in this suffix is the mask of the image with the same stem
  # (crops: NAME.jpg + NAME.png)
  mask_suffix: ".png"
  # first capture group = source photo id; crops NAME_<a>_<b>.jpg of one photo share it
  source_id_regex: '^(\d{8}_\d{6}|IMG_\d+)'
  # Photos that also appear, rotated, in train (val, test) or val (test), sometimes saved
  # under the next second's timestamp. Found by crackqa qa (rotation-aware dHash, source
  # ids); they stay in the earlier split and are dropped from the later one. Quote the ids:
  # YAML reads 20160328_151057 as an integer.
  exclude_sources:
    val: ["20160328_151057", "20160328_151244"]
    test:
      - "20160328_154452"
      - "20160328_154454"
      - "20160329_103609"
      - "20160329_103800"
      - "20160329_103807"
      - "20160329_111111"

qa:
  near_dup_max_hamming: 4
  # crackqa qa-extra: a dHash candidate pair counts as a duplicate only when the fine texture
  # of the two aligned 128 px thumbnails correlates at least this much. The 56 known CRACK500
  # leak pairs score 0.999 or more; the closest pair of different photos in the extra datasets
  # scores 0.545 (greyscale road textures share dHash bits without being the same picture).
  confirm_min_ncc: 0.9

tiling:
  tile_size: 128
  stride: 128
  # true: drop the leftover strip at the right and bottom edges;
  # false: add one more tile flush with the edge (it overlaps its neighbour)
  drop_edge: true

labels:
  # crack if crack pixels >= crack_min_px, no crack if 0, ambiguous in between
  # (ambiguous tiles are left out of training and metrics but counted)
  crack_min_px: 50

# Classical detector: CLAHE, Gaussian blur, black-hat, per image percentile threshold,
# small component removal. Chosen on val (see reports/baseline_val.json). CRACK500 cracks are
# 20 to 30 px wide, so the black-hat kernel must be wider than that, and Otsu splits the
# gravel texture instead of finding the crack. The percentile rule assumes every image holds
# a crack (true for the CRACK500 crops), so it over-flags crack-free photos.
baseline:
  clahe_clip: 2.0
  clahe_grid: 8
  blur_kernel: 9
  blackhat_kernel: 71
  threshold_percentile: 85
  min_component_px: 1000
  # the tile decision threshold on the crack pixel ratio is tuned on val by crackqa baseline

train:
  pretrained: true              # ImageNet weights for ResNet18
  epochs: 5                     # stage A: frozen backbone, train the head
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_train_tiles: 8000         # CPU budget cap, sampled per class with the seed
  patience: 2                   # early stopping on val F1
  finetune_layer4_epochs: 6     # stage B: unfreeze layer4 (stage A alone: val F1 0.753)
  finetune_lr: 0.0001

# Error analysis on the saved test predictions (no retuning)
analysis:
  bootstrap_resamples: 2000     # 95% CI of F1, resampling source photos
  worst_errors: 12              # most confident false positives and negatives to inspect

# Second dataset scored with the frozen model and thresholds, no retraining
cross_dataset:
  name: CFD
  images: data/raw/CFD/cfd_image
  masks: data/raw/CFD/seg_gt
  mask_suffix: ".png"

# SmallUNet pixel segmentation (stretch goal); threshold chosen on val pixels
seg:
  levels: 4
  base_channels: 16             # about 1.94M parameters
  crop_size: 256
  crops_per_image: 1            # random crops per train image per epoch
  batch_size: 8
  epochs: 12
  lr: 0.001
  dice_weight: 1.0              # loss = BCE + dice_weight * Dice
  patience: 3

# Extra road datasets for the next model version, checked by crackqa qa-extra; not used for
# training yet. Source and terms of each are in DATA.md. A dataset gives either pixel masks
# (masks + mask_name: [pattern, replacement] from the image path, relative and without its
# extension, to the mask path; invert_mask when cracks are 0 on white) or labels by folder
# (label_dirs; masks null, mask_name [], invert_mask false).
extra_data:
  GAPS384:
    images: data/raw/GAPS384/croppedimg
    image_exts: [".jpg"]
    masks: data/raw/GAPS384/croppedgt
    mask_name: ['^(.*)$', '\1.png']
    invert_mask: false
    label_dirs: {}
    # crops train_0554_541_1.jpg: GAPs photo id, then the crop's y and x
    source_id_regex: '^((?:train|valid|test)_\d{4})_'
  cracktree200:
    images: data/raw/cracktree200/cracktree200rgb
    image_exts: [".jpg"]
    masks: data/raw/cracktree200/cracktree200_gt
    mask_name: ['^(.*)$', '\1.png']
    invert_mask: false
    label_dirs: {}
    source_id_regex: '^(\d+)\.'
  AEL:
    images: data/raw/AEL/img
    image_exts: [".jpg"]
    masks: data/raw/AEL/gt
    # AIGLE_RN/Im_GT_AIGLE_RN_C18aor -> AIGLE_RN/GT_AIGLE_RN_C18a.png
    mask_name: ['^(\w+)/Im_(GT_\w+?)(?:or)?$', '\1/\2.png']
    invert_mask: true             # cracks are black on white
    label_dirs: {}
    # parts a and b of one survey image share the id (AIGLE_RN_C18)
    source_id_regex: '^Im_GT_([A-Z_]+?_[A-Z]?\d+)[a-z]'
  # also the cross dataset test above (same files); checked here before it joins training
  CFD:
    images: data/raw/CFD/cfd_image
    image_exts: [".jpg"]
    masks: data/raw/CFD/seg_gt
    mask_name: ['^(.*)$', '\1.png']
    invert_mask: false
    label_dirs: {}
    source_id_regex: '^(\d+)\.'
  # pavement subset only: 256 px patches, labelled by folder; 001-100.jpg is patch 100 of
  # photo 001
  SDNET2018:
    images: data/raw/SDNET2018/P
    image_exts: [".jpg"]
    masks: null
    mask_name: []
    invert_mask: false
    label_dirs: {CP: crack, UP: no_crack}
    source_id_regex: '^(\d{3})-'

# Next model version (V2): one tile table over CRACK500 and extra_data, written by
# crackqa v2-split to v2.processed with reports/v2_balance.md and reports/test2_lock.txt.
# The V1 files (tiles.csv, manifest_*.csv, test_lock.txt) are left as they are.
# CRACK500 keeps its official train and val (minus data.exclude_sources); its test crops
# stay out. Every other dataset listed here is split by group of source photos.
v2:
  processed: data/processed/v2
  # pixels: the V1 rule (labels.crack_min_px). centerline: crack when the tile holds at least
  # centerline_min_px pixels of the mask's centre line (Zhang-Suen thinning), no crack when it
  # holds no mask pixel, ambiguous otherwise. Chosen on val tiles where the rules disagree:
  # under 16 px of centre line the crack only grazes a corner or the border; 16 to 31 px are
  # short corner or edge clips in every dataset; tiles with 50 or more mask pixels but under
  # 32 px of centre line are almost all a wide mask reaching over the border.
  label_rule: centerline
  centerline_min_px: 32
  datasets:
    CFD:          {train: 0.8, val: 0.2, test: 0.0, gap: 0, block: 10, crack_free_to_test: false}
    GAPS384:      {train: 0.6, val: 0.2, test: 0.2, gap: 1, block: 0, crack_free_to_test: false}
    cracktree200: {train: 0.6, val: 0.2, test: 0.2, gap: 1, block: 0, crack_free_to_test: false}
    AEL:          {train: 0.6, val: 0.2, test: 0.2, gap: 1, block: 0, crack_free_to_test: false}
    SDNET2018:    {train: 0.6, val: 0.2, test: 0.2, gap: 0, block: 4, crack_free_to_test: true}
