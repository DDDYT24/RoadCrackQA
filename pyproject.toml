[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crackqa"
version = "0.1.0"
description = "Road crack image QA and detection pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "matplotlib==3.11.2",
    "opencv-python-headless==4.14.0.94",
    "PyYAML==6.0.3",
    # Install the CPU wheels first:
    # pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
crackqa = "crackqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
